name: Discover PS5 update URLs
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Discover public Sony URLs
        run: python discover_ps5.py
      - name: Save discovered candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ps5_sources.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update PS5 URL candidates [skip ci]'
            git push
          fi
